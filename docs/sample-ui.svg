  <text x="268" y="522" font-family="Arial, sans-serif" font-size="10" fill="#141414">▼</text>
  <text x="292" y="522" font-family="Arial, sans-serif" font-size="13" fill="#202020">example-tenancy (root)</text>

  <text x="288" y="550" font-family="Arial, sans-serif" font-size="10" fill="#141414">▼</text>
  <text x="312" y="550" font-family="Arial, sans-serif" font-size="13" fill="#202020">Finance</text>

  <text x="308" y="578" font-family="Arial, sans-serif" font-size="10" fill="#141414">▶</text>
  <text x="332" y="578" font-family="Arial, sans-serif" font-size="13" fill="#202020">Payroll</text>

  <text x="288" y="606" font-family="Arial, sans-serif" font-size="10" fill="#141414">▶</text>
  <text x="312" y="606" font-family="Arial, sans-serif" font-size="13" fill="#202020">Shared Services</text>

  <text x="288" y="634" font-family="Arial, sans-serif" font-size="10" fill="#141414">▶</text>
  <text x="312" y="634" font-family="Arial, sans-serif" font-size="13" fill="#202020">Engineering</text>

  <text x="288" y="662" font-family="Arial, sans-serif" font-size="10" fill="#141414">▶</text>
  <text x="312" y="662" font-family="Arial, sans-serif" font-size="13" fill="#202020">Operations</text>

  <text x="255" y="704" font-family="Arial, sans-serif" font-size="12" fill="#667085">Selected path</text>
  <rect x="255" y="714" width="310" height="46" rx="6" fill="#f8fafc" stroke="#d9dee7"/>
  <text x="263" y="742" font-family="monospace" font-size="11" fill="#1f2933">example-tenancy (root):Finance</text>

  <text x="255" y="784" font-family="Arial, sans-serif" font-size="12" fill="#667085">Selected OCID</text>
  <text x="255" y="804" font-family="monospace" font-size="11" fill="#1f2933">ocid1.compartment.oc1..aaaa...</text>
  <rect x="530" y="788" width="38" height="22" rx="6" fill="#f7eee9" stroke="#d9dee7"/>
  <text x="538" y="803" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#5d2f20">Copy</text>

  <rect x="239" y="838" width="342" height="34" rx="8" fill="#7a3f2a" stroke="#7a3f2a"/>
  <text x="384" y="860" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Copy All</text>

  <g font-family="Arial, sans-serif" font-size="12" fill="#667085">
    <text x="363" y="900" font-weight="700">v1.0.0</text>
    <text x="414" y="900">|</text>
    <text x="434" y="900" font-weight="700" fill="#5d2f20">in</text>
    <text x="458" y="900">|</text>
    <circle cx="486" cy="896" r="7" fill="#5d2f20"/>
    <text x="482" y="900" font-size="10" font-weight="700" fill="#ffffff">GH</text>
  </g>
