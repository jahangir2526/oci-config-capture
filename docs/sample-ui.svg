<svg xmlns="http://www.w3.org/2000/svg" width="820" height="980" viewBox="0 0 820 980" role="img" aria-labelledby="title desc">
  <title id="title">OCI Config Capture popup sample layout</title>
  <desc id="desc">Current popup layout showing captured OCI config fields, compact compartment tree, selected path, selected OCID, Copy All, and footer links.</desc>
  <rect width="820" height="980" fill="#f6f7f9"/>
  <rect x="215" y="28" width="390" height="924" rx="8" fill="#ffffff" stroke="#d9dee7"/>

  <text x="239" y="64" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2933">OCI Config Capture</text>
  <text x="239" y="86" font-family="Arial, sans-serif" font-size="13" fill="#667085">Updated at 10:42:18</text>
  <rect x="518" y="46" width="64" height="34" rx="8" fill="#7a3f2a" stroke="#7a3f2a"/>
  <text x="532" y="68" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Capture</text>

  <rect x="239" y="108" width="342" height="284" rx="8" fill="#ffffff" stroke="#d9dee7"/>
  <g font-family="Arial, sans-serif" font-size="13">
    <text x="255" y="136" fill="#667085">Tenancy name</text>
    <text x="380" y="136" font-weight="700" fill="#1f2933">example-tenancy</text>
    <rect x="530" y="120" width="38" height="22" rx="6" fill="#f7eee9" stroke="#d9dee7"/>
    <text x="538" y="135" font-size="11" font-weight="700" fill="#5d2f20">Copy</text>
    <line x1="239" y1="154" x2="581" y2="154" stroke="#d9dee7"/>

    <text x="255" y="182" fill="#667085">Tenancy OCID</text>
    <text x="380" y="182" font-family="monospace" font-size="12" fill="#1f2933">ocid1.tenancy...</text>
    <rect x="530" y="166" width="38" height="22" rx="6" fill="#f7eee9" stroke="#d9dee7"/>
    <text x="538" y="181" font-size="11" font-weight="700" fill="#5d2f20">Copy</text>
    <line x1="239" y1="200" x2="581" y2="200" stroke="#d9dee7"/>

    <text x="255" y="228" fill="#667085">Identity Domain</text>
    <text x="380" y="228" font-weight="700" fill="#1f2933">Default</text>
    <rect x="530" y="212" width="38" height="22" rx="6" fill="#f7eee9" stroke="#d9dee7"/>
    <text x="538" y="227" font-size="11" font-weight="700" fill="#5d2f20">Copy</text>
    <line x1="239" y1="246" x2="581" y2="246" stroke="#d9dee7"/>

    <text x="255" y="274" fill="#667085">Username</text>
    <text x="380" y="274" font-weight="700" fill="#1f2933">user@example.com</text>
    <rect x="530" y="258" width="38" height="22" rx="6" fill="#f7eee9" stroke="#d9dee7"/>
    <text x="538" y="273" font-size="11" font-weight="700" fill="#5d2f20">Copy</text>
    <line x1="239" y1="292" x2="581" y2="292" stroke="#d9dee7"/>

    <text x="255" y="320" fill="#667085">User OCID</text>
    <text x="380" y="320" font-family="monospace" font-size="12" fill="#1f2933">ocid1.user...</text>
    <rect x="530" y="304" width="38" height="22" rx="6" fill="#f7eee9" stroke="#d9dee7"/>
    <text x="538" y="319" font-size="11" font-weight="700" fill="#5d2f20">Copy</text>
    <line x1="239" y1="338" x2="581" y2="338" stroke="#d9dee7"/>

    <text x="255" y="366" fill="#667085">Current region</text>
    <text x="380" y="366" font-weight="700" fill="#1f2933">ap-singapore-1</text>
    <rect x="530" y="350" width="38" height="22" rx="6" fill="#f7eee9" stroke="#d9dee7"/>
    <text x="538" y="365" font-size="11" font-weight="700" fill="#5d2f20">Copy</text>
