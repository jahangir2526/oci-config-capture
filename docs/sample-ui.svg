  <rect x="239" y="410" width="342" height="410" rx="8" fill="#ffffff" stroke="#d9dee7"/>
  <text x="255" y="438" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933">Compartment Selector</text>
