<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OCI Config Capture</title>
    <link rel="stylesheet" href="./popup.css">
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <div>
          <h1>OCI Config Capture</h1>
          <p id="statusText">Click Capture to read the active OCI tab.</p>
        </div>
        <button id="captureButton" class="capture-button" type="button">
          Capture
        </button>
      </header>

      <section id="errorPanel" class="notice hidden" role="status"></section>

      <section id="sessionPanel" class="panel">
        <dl class="fields">
          <div>
            <dt>Tenancy name</dt>
            <dd>
              <span id="tenancyName">-</span>
              <button class="copy-button" type="button" data-copy-target="tenancyName" title="Copy tenancy name" aria-label="Copy tenancy name">Copy</button>
            </dd>
          </div>
          <div>
            <dt>Tenancy OCID</dt>
            <dd>
              <span class="mono" id="tenancyOcid">-</span>
              <button class="copy-button" type="button" data-copy-target="tenancyOcid" title="Copy tenancy OCID" aria-label="Copy tenancy OCID">Copy</button>
            </dd>
          </div>
          <div>
            <dt>Identity Domain</dt>
            <dd>
              <span id="identityDomain">-</span>
              <button class="copy-button" type="button" data-copy-target="identityDomain" title="Copy identity domain" aria-label="Copy identity domain">Copy</button>
            </dd>
          </div>
          <div>
            <dt>Username</dt>
            <dd>
              <span id="username">-</span>
              <button class="copy-button" type="button" data-copy-target="username" title="Copy username" aria-label="Copy username">Copy</button>
            </dd>
          </div>
          <div>
            <dt>User OCID</dt>
            <dd>
              <span class="mono" id="userOcid">-</span>
              <button class="copy-button" type="button" data-copy-target="userOcid" title="Copy user OCID" aria-label="Copy user OCID">Copy</button>
            </dd>
          </div>
          <div>
            <dt>Current region</dt>
            <dd>
              <span id="region">-</span>
              <button class="copy-button" type="button" data-copy-target="region" title="Copy current region" aria-label="Copy current region">Copy</button>
            </dd>
          </div>
        </dl>
      </section>

      <section class="panel compartments">
        <div class="section-title">
          <h2>Compartment Selector</h2>
          <span id="compartmentCount">0</span>
        </div>
        <label class="search">
          <span class="visually-hidden">Search compartments</span>
          <input id="compartmentSearch" type="search" placeholder="Search compartments" autocomplete="off">
        </label>
        <div id="compartmentList" class="list" role="listbox" aria-label="Compartments"></div>
        <label class="selected-path">
          <span>Selected path</span>
          <textarea id="selectedCompartmentPath" readonly rows="2">-</textarea>
        </label>
        <div class="selected">
          <span>Selected OCID</span>
          <div class="selected-value">
            <output id="selectedCompartmentOcid" class="mono">-</output>
            <button class="copy-button" type="button" data-copy-target="selectedCompartmentOcid" title="Copy selected compartment OCID" aria-label="Copy selected compartment OCID">Copy</button>
          </div>
        </div>
      </section>

      <section id="warningsPanel" class="warnings hidden"></section>

      <button id="copyAllButton" class="copy-all-button" type="button">
        Copy All
      </button>

      <footer class="footer">
        <strong>v1.0.0</strong>
        <span aria-hidden="true">|</span>
        <a href="https://sg.linkedin.com/in/jahangir2526" target="_blank" rel="noopener noreferrer" title="LinkedIn profile" aria-label="LinkedIn profile">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M6.94 8.98H3.75V20h3.19V8.98ZM5.35 7.47c1.02 0 1.85-.84 1.85-1.86 0-1-.83-1.82-1.85-1.82S3.5 4.61 3.5 5.61c0 1.02.83 1.86 1.85 1.86ZM20.5 20v-6.06c0-3.04-1.62-4.45-3.78-4.45-1.74 0-2.52.96-2.95 1.63V8.98h-3.06V20h3.19v-5.46c0-1.44.27-2.84 2.06-2.84 1.76 0 1.78 1.65 1.78 2.93V20h2.76Z"/>
          </svg>
        </a>
        <span aria-hidden="true">|</span>
        <a href="https://github.com/smjalam2025/my-oci-info-capture" target="_blank" rel="noopener noreferrer" title="GitHub repository" aria-label="GitHub repository">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 2.75a9.25 9.25 0 0 0-2.93 18.03c.46.08.63-.2.63-.44v-1.58c-2.56.56-3.1-1.1-3.1-1.1-.42-1.07-1.02-1.35-1.02-1.35-.84-.57.06-.56.06-.56.93.07 1.42.96 1.42.96.82 1.41 2.16 1 2.69.77.08-.6.32-1 .59-1.23-2.05-.23-4.2-1.03-4.2-4.57 0-1.01.36-1.83.95-2.48-.1-.23-.41-1.17.09-2.44 0 0 .78-.25 2.54.95a8.8 8.8 0 0 1 4.62 0c1.76-1.2 2.53-.95 2.53-.95.51 1.27.19 2.21.1 2.44.59.65.95 1.47.95 2.48 0 3.55-2.16 4.33-4.21 4.56.33.29.62.85.62 1.71v2.37c0 .24.16.52.63.43A9.25 9.25 0 0 0 12 2.75Z"/>
          </svg>
        </a>
      </footer>
    </main>
    <script src="./popup.js" type="module"></script>
  </body>
</html>
